<!doctype html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}home-page{{ else }}inner-page{{ end }}">
    <a class="skip-link" href="#content">{{ (.Site.GetPage "/").Params.ui.skip_to_content }}</a>
    {{ partial "header.html" . }}
    <main id="content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
