{{ define "main" }}
<article class="page-shell about-page">
  {{ partial "breadcrumbs.html" . }}
  <header class="page-heading">
    <p class="eyebrow">Dr. Nkanyiso</p>
    <h1>{{ .Title }}</h1>
    <p class="page-description">{{ .Description }}</p>
  </header>
  <div class="about-grid">
    <div class="about-image-wrap">
      {{ partial "about-image.html" . }}
      <span class="about-image-accent" aria-hidden="true"></span>
    </div>
    <div class="prose about-page-copy">
      {{ .Content }}
      <div class="article-end">
        <a class="button button-service" href="{{ "/services/" | relURL }}">Explore services {{ partial "icon.html" "arrow" }}</a>
        <a class="text-link" href="{{ "/contact-us/" | relURL }}">Contact information {{ partial "icon.html" "arrow" }}</a>
      </div>
    </div>
  </div>
</article>
{{ end }}
