{{ define "main" }}
  <section class="page-shell not-found">
    {{ $ui := (.Site.GetPage "/").Params.ui }}
    <p class="eyebrow">{{ $ui.not_found_label }}</p>
    <h1>{{ $ui.not_found_heading }}</h1>
    <p>{{ $ui.not_found_body }}</p>
    <a class="button button-primary" href="{{ "/" | relURL }}">{{ $ui.not_found_button }}</a>
    <a class="text-link" href="{{ "/blog/" | relURL }}">Browse insights {{ partial "icon.html" "arrow" }}</a>
  </section>
{{ end }}
